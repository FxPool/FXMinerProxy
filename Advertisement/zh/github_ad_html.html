<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滚动广告</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .ad-container {
            width: 600px;
            height: 40px;
            overflow: hidden;
            background-color: #f8f9fa;
        }
        
        .scrolling-content {
            display: flex;
            height: 100%;
            animation: scroll 30s linear infinite;
            white-space: nowrap;
        }
        
        .ad-container:hover .scrolling-content {
            animation-play-state: paused;
        }
        
        .ad-item {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            flex-shrink: 0;
            font-weight: 500;
            font-size: 14px;
        }
        
        .ad-item:nth-child(1) { background-color: #ff6b6b; color: white; }
        .ad-item:nth-child(2) { background-color: #4ecdc4; color: white; }
        .ad-item:nth-child(3) { background-color: #ffd166; color: #333; }
        .ad-item:nth-child(4) { background-color: #06d6a0; color: white; }
        .ad-item:nth-child(5) { background-color: #118ab2; color: white; }
        .ad-item:nth-child(6) { background-color: #ef476f; color: white; }
        .ad-item:nth-child(7) { background-color: #073b4c; color: white; }
        .ad-item:nth-child(8) { background-color: #7209b7; color: white; }
        .ad-item:nth-child(9) { background-color: #ff9e00; color: white; }
        .ad-item:nth-child(10) { background-color: #9d4edd; color: white; }
        
        .ad-icon {
            width: 24px;
            height: 24px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255,255,255,0.2);
            border-radius: 4px;
        }
        
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <div class="ad-container">
        <div class="scrolling-content" id="scrollingContent"></div>
    </div>

    <script>
        // 新的广告内容 - 按要求修改
        const ads = [
            { text: "⚠️ 如果viabtc矿池挖矿无效太高请更新到最新版本使用指定难度65536可减少无效份额，动态修改抽水不生效请更新到最新版本", color: "#ff6b6b", icon: "⚠️" }
        ];
        
        const scrollingContent = document.getElementById('scrollingContent');
        // 复制多份以实现无缝滚动（原有逻辑是复制两份，这里保持相同方式）
        const adsCopy = [...ads, ...ads];
        
        adsCopy.forEach((ad, index) => {
            const adItem = document.createElement('div');
            adItem.className = 'ad-item';
            adItem.style.backgroundColor = ad.color;
            adItem.innerHTML = `<span class="ad-icon">${ad.icon}</span><span>${ad.text}</span>`;
            scrollingContent.appendChild(adItem);
        });
    </script>
</body>
</html>
